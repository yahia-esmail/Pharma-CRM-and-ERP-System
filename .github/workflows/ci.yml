# Build, test and publish on every push and pull request. The publish output (API, dashboard, field app) is kept as
# a build artifact for 14 days; it carries no secrets (deploy/README.md) and points the field app at the development
# API, so a release is still published with deploy/publish.ps1 and the production field app settings.
name: CI

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PharmaERP.slnx

      # Same script as a release: Release build, all tests, publish, and the "no secret files in the output" check.
      - name: Build, test and publish
        shell: pwsh
        run: ./deploy/publish.ps1 -Output artifacts/publish

      - uses: actions/upload-artifact@v4
        with:
          name: pharmaerp-publish-${{ github.sha }}
          path: artifacts/publish
          retention-days: 14
