# nginx sample for Linux hosting (the IIS equivalent is src/FieldApp/web.config plus the ASP.NET Core Module).
# Three sites: the field app (static files), the API and the dashboard (Kestrel behind nginx).
# Replace example.com, the certificate paths and the folders. Kestrel apps listen on localhost only:
#   ASPNETCORE_URLS=http://127.0.0.1:5001 (API) and http://127.0.0.1:5002 (dashboard) — see deploy/README.md.

# ---------- Field app (Blazor WebAssembly PWA) ----------
server {
    listen 443 ssl;
    http2 on;
    server_name field.example.com;
    ssl_certificate     /etc/ssl/field.example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/field.example.com/privkey.pem;

    root /var/www/pharmaerp/fieldapp/wwwroot;   # the "wwwroot" folder of the published field app

    # The build ships .br and .gz copies of every file. brotli_static needs the ngx_brotli module; without it,
    # gzip_static still serves the .gz copies.
    # brotli_static on;
    gzip_static on;

    types {
        application/wasm               wasm;
        application/octet-stream       dll dat blat webcil;
        application/manifest+json      webmanifest;
    }

    # File names are not fingerprinted (see PharmaERP.FieldApp.csproj): every file revalidates so a release is
    # picked up; the service worker keeps the offline copy. add_header in a location replaces the server's,
    # so the security headers are in a snippet included everywhere.
    location / {
        include /etc/nginx/snippets/pharmaerp-fieldapp-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}

# Save as /etc/nginx/snippets/pharmaerp-fieldapp-headers.conf (connect-src: the API's origin):
#   add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; connect-src 'self' https://api.example.com; font-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
#   add_header X-Content-Type-Options "nosniff" always;
#   add_header Referrer-Policy "strict-origin-when-cross-origin" always;
#   add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(), payment=()" always;
#   add_header Strict-Transport-Security "max-age=31536000" always;

# ---------- API ----------
server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;
    ssl_certificate     /etc/ssl/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/api.example.com/privkey.pem;

    client_max_body_size 12m;   # photo attachments (collections, expenses)

    location / {
        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        # The API trusts these only from loopback / ReverseProxy:KnownProxies; the sign-in rate limit keys on the IP.
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ---------- Dashboard ----------
server {
    listen 443 ssl;
    http2 on;
    server_name admin.example.com;
    ssl_certificate     /etc/ssl/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/admin.example.com/privkey.pem;

    client_max_body_size 12m;

    location / {
        proxy_pass         http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name field.example.com api.example.com admin.example.com;
    return 301 https://$host$request_uri;
}
